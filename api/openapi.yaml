openapi: 3.1.0
info:
  title: Reqora API
  version: 0.1.0
  description: |
    Workflows are directed acyclic graphs of nodes connected by edges. Running a workflow executes
    its nodes in dependency order starting from its single trigger node; condition nodes choose which
    output port (`true`/`false`) continues, and nodes on untaken branches are recorded as `skipped`.

    **Templates.** String fields marked *template* may contain `{{path}}` placeholders resolved at run time
    against: `trigger.body.*`, `trigger.headers.*`, `env.NAME` (the run environment's stored variable, falling back to the server variable
    `REQORA_ENV_NAME`; a missing variable fails the step; stored runs keep real values, but resolved values are scrubbed from a deployed webhook's response), and `<nodeId>.*` (the output of an already-executed node, e.g.
    `{{node-2.body.customer_id}}`). In an HTTP `body`, a placeholder inside a JSON string literal is inserted
    as string content; a bare placeholder is inserted as a JSON value.

    Errors use `application/problem+json` (RFC 9457).

    **Scripts (collections).** Pre-request and post-response scripts are JavaScript run in a QuickJS sandbox
    (WebAssembly; no network, files, timers or Node APIs; 1 s CPU and 32 MB per script). They get `rq`:
    `rq.request` (method, url, params, headers, body — templates unresolved, auth not yet applied; editable in
    pre-request scripts), `rq.response` (status, statusText, headers, body text, responseTime, json(); post only),
    `rq.variables.get/set/unset/toObject` (usable in templates as `{{vars.NAME}}`),
    `rq.environment.get("NAME")` (only names written literally are available, plus names set earlier in the
    send), `rq.environment.set/unset/has` (changes are saved to the environment the request is sent in, keep an
    existing variable's kind — a secret stays encrypted — and resolve in `{{env.NAME}}` for the same send),
    `rq.test(name, fn)`,
    `rq.expect(value)` (toBe, toEqual, toContain, toBeTruthy, toBeFalsy, toBeGreaterThan, toBeLessThan,
    toHaveProperty, toMatch) and `console`. Scripts run as an async function, so top-level `await` works; they
    also have `crypto.subtle` (digest, importKey/exportKey, sign/verify with HMAC, RSASSA-PKCS1-v1_5, RSA-PSS,
    ECDSA, Ed25519, encrypt/decrypt with RSA-OAEP, AES-GCM, AES-CBC), `crypto.getRandomValues/randomUUID`,
    `TextEncoder`/`TextDecoder`, `btoa`/`atob`, `rq.environment.replaceIn` and `require("crypto-js" | "lodash" | "moment")`.
    Send responses and stored workflow runs show real values, like Postman.

    **Authentication.** Every operation requires the `reqora_session` cookie from `POST /api/auth/login`
    (401 otherwise), except the ones marked `security: []`: the auth endpoints, the webhook entry point
    (callers are external systems) and the local demo upstreams.
security:
  - sessionCookie: []
servers:
  - url: http://localhost:3000
paths:
  /api/auth/signup:
    post:
      operationId: signUp
      summary: Create an account and start a session
      description: |
        Open only while no accounts exist (bootstrapping the first one), or when the server sets
        `REQORA_ALLOW_SIGNUP=true`. Otherwise 403 — admins add users with `npm run user -- create`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                remember: { type: boolean, default: false, description: 30-day persistent cookie instead of a 12h browser-session cookie }
      responses:
        "201":
          description: Created; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/auth/login:
    post:
      operationId: logIn
      summary: Start a session
      description: After 5 failed attempts for an email from one client, further attempts get 429 for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                remember: { type: boolean, default: false }
      responses:
        "200":
          description: Signed in; sets the session cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/auth/logout:
    post:
      operationId: logOut
      summary: End the current session
      security: []
      responses:
        "204": { description: Signed out; clears the cookie }
  /api/auth/password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: Checks the current password (failed attempts are rate-limited), then signs out every other session of the user; this one stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/auth/session:
    get:
      operationId: getSession
      summary: Current user (or null) and whether sign-up is open
      security: []
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                type: object
                required: [user, signupOpen, firstRun]
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/User"
                      - type: "null"
                  signupOpen: { type: boolean }
                  firstRun: { type: boolean, description: No accounts exist yet }
  /api/workflows:
    get:
      operationId: listWorkflows
      summary: List workflows (most recently updated first)
      responses:
        "200":
          description: Workflow summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowSummary" }
    post:
      operationId: createWorkflow
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getWorkflow
      summary: Get a workflow
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceWorkflow
      summary: Replace a workflow's definition
      description: |
        Optimistic concurrency: `version` must equal the stored version or the request fails with 409.
        On success the version is incremented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WorkflowInput"
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow and its runs
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/deploy:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    post:
      operationId: deployWorkflow
      summary: Make a draft version live on the webhook endpoint
      description: |
        Snapshots the workflow's current definition as its deployment. `version` must equal the current
        draft version (409 otherwise), so you deploy exactly what you last saw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Deployed; `deployment` reflects the new live version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/environments/{environment}/variables:
    parameters:
      - $ref: "#/components/parameters/Environment"
    get:
      operationId: listVariables
      summary: Variables in an environment, with where each is used
      responses:
        "200":
          description: |
            `data` holds the environment's variables (secret values are null). `missing` lists names referenced
            as `{{env.NAME}}` by some workflow draft but not set in this environment; `fromServerEnv` tells
            whether a `REQORA_ENV_NAME` server variable will be used as a fallback.
          content:
            application/json:
              schema:
                type: object
                required: [environment, data, missing]
                properties:
                  environment: { $ref: "#/components/schemas/EnvironmentName" }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Variable"
                        - type: object
                          required: [usage]
                          properties:
                            usage: { type: array, items: { $ref: "#/components/schemas/VariableReference" } }
                  missing:
                    type: array
                    items:
                      type: object
                      required: [name, usage, fromServerEnv]
                      properties:
                        name: { type: string }
                        usage: { type: array, items: { $ref: "#/components/schemas/VariableReference" } }
                        fromServerEnv: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
  /api/environments/{environment}/variables/{name}:
    parameters:
      - $ref: "#/components/parameters/Environment"
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$" }
    put:
      operationId: putVariable
      summary: Create or replace a variable
      description: |
        Secret values are encrypted at rest (AES-256-GCM) and are write-only. Returns 503 when the server has
        no `REQORA_SECRET_KEY` configured (required in production builds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [secret, plain] }
                value: { type: string, maxLength: 10000 }
                description: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteVariable
      summary: Delete a variable
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: listWorkflowRuns
      summary: List a workflow's runs (newest first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: runWorkflow
      summary: Execute a workflow synchronously
      description: |
        Executes the stored workflow and returns the completed run. A run whose steps fail still returns
        201 with `status: failed`; inspect `steps[].error`.

        Send `Accept: application/x-ndjson` to follow the run live: the response streams one JSON object per
        line — `{"type":"node","nodeId"}` when a node starts, `{"type":"attempt","nodeId","attempt","maxAttempts","waitMs","logs"}`
        when a "repeat until" node's condition isn't met yet and it will send again, `{"type":"step","step"}` when a
        step finishes or is skipped, then `{"type":"run","run"}` with the stored run (or `{"type":"error","message"}`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "201":
          description: Run finished (succeeded or failed)
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
            application/x-ndjson:
              schema:
                type: object
                description: One progress event per line (see the operation description).
                required: [type]
                properties:
                  type: { type: string, enum: [node, step, run, error] }
                  nodeId: { type: string }
                  step: { $ref: "#/components/schemas/Step" }
                  run: { $ref: "#/components/schemas/Run" }
                  message: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/load-tests:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: listLoadTests
      summary: List the workflow's load tests (newest first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Load test summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LoadTestSummary" } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: startLoadTest
      summary: Start a load test of the workflow's draft
      description: |
        Runs the flow with `virtualUsers` concurrent loops on the server, each running it back to back (with
        `thinkTimeMs` between runs, users started evenly over `rampUpSec`) until `iterations` runs are done or
        `durationSec` has passed. Runs are not stored in Execution History; poll `GET /api/load-tests/{id}` for the
        live report. At most 3 tests run at once on a server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoadTestConfig" }
      responses:
        "202":
          description: Started; the initial report
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadTest" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/load-tests/{loadTestId}:
    parameters:
      - $ref: "#/components/parameters/LoadTestId"
    get:
      operationId: getLoadTest
      summary: Get a load test report (live while running)
      description: A `running` test whose server restarted is reported as `interrupted`.
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadTest" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/load-tests/{loadTestId}/stop:
    parameters:
      - $ref: "#/components/parameters/LoadTestId"
    post:
      operationId: stopLoadTest
      summary: Stop a running load test
      description: Requests in flight are cancelled and left out of the report. Returns the final report.
      responses:
        "200":
          description: The final report (status `stopped`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadTest" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/deployments:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: listDeployments
      summary: Deployment history (newest first; the first entry is live)
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DeploymentRecord" } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
      - $ref: "#/components/parameters/DeploymentId"
    get:
      operationId: getDeployment
      summary: A deployment with the nodes and edges it deployed
      responses:
        "200":
          description: The deployment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DeploymentRecord"
                  - type: object
                    required: [nodes, edges]
                    properties:
                      nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
                      edges: { type: array, items: { $ref: "#/components/schemas/Edge" } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/deployments/{deploymentId}/rollback:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
      - $ref: "#/components/parameters/DeploymentId"
    post:
      operationId: rollbackDeployment
      summary: Make an earlier deployment live again
      description: The webhook runs that deployment from now on; this is recorded as a new history entry (`rollbackOf`). The draft is unchanged.
      responses:
        "200":
          description: The workflow, with its new `deployment`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/workflows/{workflowId}/deployments/{deploymentId}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
      - $ref: "#/components/parameters/DeploymentId"
    post:
      operationId: restoreDeployment
      summary: Replace the draft with a deployment's graph
      description: Creates a new draft version with the deployment's nodes and edges, so it can be edited. The live deployment is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, description: The draft version the caller has seen }
      responses:
        "200":
          description: The workflow with the restored draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/telemetry:
    get:
      operationId: getTelemetry
      summary: Aggregated metrics over stored workflow runs
      description: |
        Totals and trend vs the previous window, run-duration percentiles, runs per period (hourly for 24h, 6-hourly
        for 7d, daily for 30d), failure spikes (periods with at least 3 failures and 20% failing), root causes of
        failures, upstream hosts called by HTTP steps, a per-node breakdown for one workflow, and the 10 newest runs.
        Load-test runs are not included. At most 20,000 runs are analysed (`sampled`).
      parameters:
        - $ref: "#/components/parameters/Since"
        - name: workflowId
          in: query
          description: "Workflow for the per-node breakdown (default: the one with the most runs)"
          schema: { type: string }
      responses:
        "200":
          description: Telemetry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Telemetry" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/runs:
    get:
      operationId: listRuns
      summary: List runs across all workflows (newest first)
      parameters:
        - $ref: "#/components/parameters/Since"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: workflowId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRuns
      summary: Permanently delete stored runs
      description: Deletes every stored run, or one workflow's with `workflowId`. Execution History, replays and telemetry lose them; deployments and load-test reports are kept.
      parameters:
        - name: workflowId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: How many runs were deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
  /api/runs/stats:
    get:
      operationId: getRunStats
      summary: Aggregate run metrics for a time window
      parameters:
        - $ref: "#/components/parameters/Since"
      responses:
        "200":
          description: Stats. Rates and durations are null when the window has no runs.
          content:
            application/json:
              schema:
                type: object
                required: [window, since, total, succeeded, failed, successRate, avgDurationMs, p95DurationMs]
                properties:
                  window: { type: string, enum: [24h, 7d, 30d] }
                  since: { type: string, format: date-time }
                  total: { type: integer }
                  succeeded: { type: integer }
                  failed: { type: integer }
                  successRate: { type: [number, "null"], minimum: 0, maximum: 1 }
                  avgDurationMs: { type: [integer, "null"] }
                  p95DurationMs: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
  /api/runs/{runId}/replay:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: replayRun
      summary: Re-run a run's trigger body against the workflow's current version
      description: Stored trigger headers are redacted, so only the body is replayed. The new run has `replayOf` set.
      responses:
        "201":
          description: The new run
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRun
      summary: Get a run
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/hooks/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/WorkflowId"
    post:
      operationId: triggerWorkflowWebhook
      security: []
      summary: Webhook entry point
      description: |
        Runs the workflow's **deployed** version (never the draft) with the raw request as its trigger: the
        JSON body becomes `trigger.body` and request headers become `trigger.headers`. Responds with the
        workflow's Response node (status and body) if one executed, otherwise 202 with the run id.
        409 if the workflow has never been deployed.
      parameters:
        - name: environment
          in: query
          schema: { $ref: "#/components/schemas/EnvironmentName" }
      requestBody:
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Body/status come from the workflow's Response node
          content:
            application/json:
              schema: {}
        "202":
          description: Run finished without a Response node
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId: { type: string }
                  status: { $ref: "#/components/schemas/RunStatus" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/collections:
    get:
      operationId: listCollections
      summary: List collections with their folders and request summaries (by name)
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Collection" }
    post:
      operationId: createCollection
      summary: Create an empty collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/collections/import:
    post:
      operationId: importCollection
      summary: Import a Reqora or Postman collection, a cURL command or an OpenAPI document
      description: |
        `postman`: a Postman Collection v2.0/v2.1. Nested folders are flattened ("Parent / Child", keeping the
        parent's auth and scripts); requests keep auth, headers, query params, raw/urlencoded/GraphQL bodies, saved
        responses and pre-request/test scripts (which run through the `pm` compatibility layer). `{{name}}` becomes
        `{{env.name}}`, or `{{vars.name}}` when scripts set it with `pm.variables.set`. With `variablesEnvironment`,
        collection variables missing from that environment are added. The response lists what was converted or
        left out in `importNotes`.

        `reqora`: `text` is a file from `GET /api/collections/{collectionId}/export` (`CollectionExport`). Creates a
        new collection with its settings, folders, requests (in order, with scripts and tests) and examples.

        `openapi` (JSON or YAML, OpenAPI 3 or Swagger 2): creates a collection named from `info.title`, with the
        base URL from `servers[0].url`, one folder per operation's first tag, and one request per path × method.
        `{param}` path parameters become `{{param}}` placeholders, query/header parameters are added (optional
        query params disabled), and JSON request bodies are pre-filled from `example` when present.

        `curl`: parses `-X/--request`, `-H/--header`, `-d/--data/--data-raw/--data-binary/--data-urlencode`,
        `--json`, `-u/--user` (basic auth), `-G`, `-I`, `--url` and the URL (its query string becomes params);
        handles single, double and ANSI-C quotes and backslash/caret line continuations. The request is added to
        `collectionId` when given, otherwise to a new collection named after the host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, text]
              properties:
                format: { type: string, enum: [reqora, postman, curl, openapi] }
                text: { type: string, minLength: 1, maxLength: 2000000 }
                collectionId: { type: string, description: "cURL only: append to this existing collection" }
                variablesEnvironment:
                  description: "postman only: add the collection's variables to this environment (existing values are kept)"
                  allOf:
                    - $ref: "#/components/schemas/EnvironmentName"
      responses:
        "201":
          description: The created (or, for cURL with `collectionId`, the updated) collection
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Collection"
                  - type: object
                    properties:
                      importNotes:
                        type: array
                        description: "postman only: what was converted, renamed or left out, and variables added"
                        items: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: getCollection
      summary: Get a collection
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateCollection
      summary: Rename a collection, change its description, or replace its inherited settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: [string, "null"], maxLength: 2000 }
                settings: { $ref: "#/components/schemas/ScopeSettings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCollection
      summary: Delete a collection with its folders, requests and examples
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/collections/{collectionId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      operationId: duplicateCollection
      summary: Duplicate a collection
      description: Copies the collection's settings, folders, requests and saved examples under new ids, named "<name> Copy".
      responses:
        "201":
          description: The copy
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/collections/{collectionId}/export:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: exportCollection
      summary: Export a collection
      description: |
        Downloads the collection as a `<name>.reqora.json` attachment: settings (auth, headers, scripts), folders
        with their settings, and every request in order with its definition and saved examples. Ids are not
        included; environment variables and secrets are not part of the file. Import it with
        `POST /api/collections/import` and `format: reqora`.

        `?format=postman` downloads a Postman Collection v2.1 (`<name>.postman_collection.json`) instead:
        `{{env.x}}`/`{{vars.x}}` become `{{x}}`, common `rq.*` calls become `pm.*`, and tests become `pm.test` scripts.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [reqora, postman], default: reqora }
      responses:
        "200":
          description: The export file
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionExport" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/collections/{collectionId}/folders:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      operationId: createFolder
      summary: Create a folder in a collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/collections/{collectionId}/requests:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      operationId: createRequest
      summary: Create a saved request (defaults to an empty GET)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                folderId: { type: [string, "null"] }
                definition: { $ref: "#/components/schemas/RequestDefinition" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/folders/{folderId}:
    parameters:
      - name: folderId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateFolder
      summary: Rename a folder and/or replace its inherited settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                settings: { $ref: "#/components/schemas/ScopeSettings" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFolder
      summary: Delete a folder and the requests inside it
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/folders/{folderId}/duplicate:
    parameters:
      - name: folderId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: duplicateFolder
      summary: Duplicate a folder
      description: Copies the folder's settings and its requests (in order, with saved examples) as "<name> Copy", placed right after the original; later folders shift down.
      responses:
        "201":
          description: The copy
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/folders/{folderId}/move:
    parameters:
      - name: folderId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: moveFolder
      summary: Reorder a folder within its collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [index]
              properties:
                index: { type: integer, minimum: 0, description: Zero-based position among the collection's folders }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/requests/{requestId}/move:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: moveRequest
      summary: Move or reorder a request
      description: |
        Places the request at `index` among the requests directly in `folderId` (or the collection root when null),
        possibly in another collection. The remaining siblings are renumbered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collectionId, folderId, index]
              properties:
                collectionId: { type: string }
                folderId: { type: [string, "null"] }
                index: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/requests/{requestId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: duplicateRequest
      summary: Duplicate a saved request
      description: Copies the saved request and its examples as "<name> Copy", placed right after the original in the same folder or collection root; later siblings shift down.
      responses:
        "201":
          description: The copy
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRequest" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/requests/to-node:
    post:
      operationId: requestToWorkflowNode
      summary: Convert a request into a workflow http node config
      description: |
        Applies the request's collection/folder auth and headers. Scripts and tests are not carried over
        (listed in `warnings`). The caller chooses where to place the node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [requestId]
                  properties:
                    requestId: { type: string }
                - type: object
                  required: [name, definition]
                  properties:
                    name: { type: string }
                    definition: { $ref: "#/components/schemas/RequestDefinition" }
                    collectionId: { type: string }
                    folderId: { type: [string, "null"] }
      responses:
        "200":
          description: Node draft
          content:
            application/json:
              schema:
                type: object
                required: [name, config, warnings]
                properties:
                  name: { type: string }
                  config: { description: "An http node config (see HttpNode)" }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getRequest
      summary: Get a saved request
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRequest" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: replaceRequest
      summary: Replace a request's name, folder and definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, folderId, definition]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                folderId: { type: [string, "null"] }
                definition: { $ref: "#/components/schemas/RequestDefinition" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRequest
      summary: Delete a request and its examples
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /api/requests/{requestId}/send:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: sendSavedRequest
      summary: Send the request's saved definition from the server
      description: |
        Templates resolve like workflow runs (`{{env.NAME}}` from the chosen environment, falling back to
        `REQORA_ENV_NAME`; `{{$guid}}`, `{{$timestamp}}`, `{{$isoTimestamp}}`). Like Postman, the result shows the
        real values that were sent (secrets included), so only people allowed to use the environment should send.
        Response bodies are capped at 1 MB.

        **When no HTTP response is received** (network error, timeout, missing variable, invalid JSON body
        template, body over 1 MB) the status is still 200 and the payload is a `SendFailure`. Upstream 4xx/5xx
        responses are returned as a normal `SendResult`.
      parameters:
        - name: environment
          in: query
          schema: { $ref: "#/components/schemas/EnvironmentName" }
      responses:
        "200":
          description: The upstream response, or a SendFailure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendOutcome" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/send:
    post:
      operationId: sendAdHocRequest
      summary: Send an ad-hoc (for example unsaved) request definition
      description: Same semantics as `sendSavedRequest`, including the 200 + `SendFailure` contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: "#/components/schemas/RequestDefinition" }
                environment: { $ref: "#/components/schemas/EnvironmentName" }
                collectionId: { type: string, description: "Inherit this collection's auth, headers and scripts" }
                folderId: { type: [string, "null"], description: "Inherit this folder's settings too" }
                requestId: { type: string, description: "The saved request being edited; links the history entry to it" }
                name: { type: string, maxLength: 200, description: "Label for script output and the send history" }
      responses:
        "200":
          description: The upstream response, or a SendFailure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendOutcome" }
        "400": { $ref: "#/components/responses/Problem" }
  /api/sends:
    get:
      operationId: listSends
      summary: Recent Collections sends (newest first)
      description: >-
        Every send (saved or ad-hoc) is recorded for the Live Execution Console: status, timing, test counts and
        script output, plus the request as sent and the response headers and body (first 256 KB). Unlike send
        responses, records keep real env/secret values (like Postman's console). The newest 200 are kept.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        "200":
          description: Sends
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SendRecord" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: clearSends
      summary: Clear the send log
      description: >-
        Deletes every recorded send (the console's "Clear" on the API requests tab). Saved requests, examples and
        workflow runs are not affected.
      responses:
        "200":
          description: How many sends were deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Problem" }
  /api/requests/{requestId}/examples:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listExamples
      summary: List saved example responses (newest first)
      responses:
        "200":
          description: Examples
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Example" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createExample
      summary: Save a response as a named example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, response]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                response: { $ref: "#/components/schemas/ExampleResponse" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Example" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/examples/{exampleId}:
    parameters:
      - name: exampleId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteExample
      summary: Delete a saved example
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: reqora_session
  parameters:
    Environment:
      name: environment
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EnvironmentName" }
    Since:
      name: since
      in: query
      description: Time window ending now
      schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }
    LoadTestId:
      name: loadTestId
      in: path
      required: true
      schema: { type: string }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    DeploymentRecord:
      type: object
      required: [id, workflowId, version, deployedAt, nodeCount, edgeCount, live]
      properties:
        id: { type: string }
        workflowId: { type: string }
        version: { type: integer, description: Draft version that was deployed }
        deployedAt: { type: string, format: date-time }
        deployedBy:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        rollbackOf:
          type: object
          description: Set when this entry re-deployed an earlier one
          required: [id, version]
          properties:
            id: { type: string }
            version: { type: integer }
        nodeCount: { type: integer }
        edgeCount: { type: integer }
        live: { type: boolean, description: What the webhook runs now }
    Telemetry:
      type: object
      required: [window, since, generatedAt, sampled, totals, latency, bucketMinutes, buckets, peak, spikes, rootCauses, upstreams, workflows, pipeline, recent]
      properties:
        window: { type: string, enum: ["24h", "7d", "30d"] }
        since: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        sampled: { type: boolean }
        totals:
          type: object
          properties:
            runs: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            successRate: { type: [number, "null"] }
            previousRuns: { type: integer }
            changePct: { type: [number, "null"] }
        latency:
          type: [object, "null"]
          properties:
            avg: { type: number }
            p50: { type: number }
            p95: { type: number }
            p99: { type: number }
        bucketMinutes: { type: integer }
        buckets:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              succeeded: { type: integer }
              failed: { type: integer }
        peak:
          type: [object, "null"]
          properties:
            start: { type: string, format: date-time }
            runs: { type: integer }
        spikes:
          type: object
          properties:
            count: { type: integer }
            last:
              type: [object, "null"]
              properties:
                start: { type: string, format: date-time }
                failed: { type: integer }
                runs: { type: integer }
        rootCauses:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              calls: { type: integer }
              failed: { type: integer }
              avgMs: { type: number }
              p95Ms: { type: number }
        workflows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              runs: { type: integer }
              failed: { type: integer }
        pipeline:
          type: [object, "null"]
          properties:
            workflowId: { type: string }
            workflowName: { type: string }
            runs: { type: integer }
            avgRunMs: { type: number }
            nodes:
              type: array
              items:
                type: object
                properties:
                  nodeId: { type: string }
                  name: { type: string }
                  type: { type: string }
                  calls: { type: integer }
                  failed: { type: integer }
                  avgMs: { type: number }
                  p95Ms: { type: number }
                  sharePct: { type: number, description: Share of the average run spent in this node }
        recent:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              workflowId: { type: string }
              workflowName: { type: string }
              status: { type: string, enum: [succeeded, failed] }
              startedAt: { type: string, format: date-time }
              durationMs: { type: number }
              environment: { $ref: "#/components/schemas/EnvironmentName" }
              source: { type: string, enum: [manual, webhook] }
              executed: { type: integer }
              failedStep:
                type: object
                properties:
                  name: { type: string }
                  error: { type: string }
                  httpStatus: { type: integer }
    LoadTestConfig:
      type: object
      required: [virtualUsers]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        virtualUsers: { type: integer, minimum: 1, maximum: 200, description: Concurrent runs of the flow }
        mode: { type: string, enum: [iterations, duration], default: iterations }
        iterations:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100
          description: Total runs (mode iterations); at least virtualUsers
        durationSec:
          type: integer
          minimum: 1
          maximum: 1800
          default: 60
          description: Seconds of load (mode duration); runs in flight at the end still finish
        rampUpSec: { type: integer, minimum: 0, maximum: 600, default: 0 }
        thinkTimeMs: { type: integer, minimum: 0, maximum: 60000, default: 0 }
        trigger:
          type: object
          properties:
            body: { description: Webhook payload every run receives }
            headers: { type: object, additionalProperties: { type: string } }
        thresholds:
          type: object
          description: The test fails (verdict) when any is exceeded.
          properties:
            maxErrorRatePct: { type: number, minimum: 0, maximum: 100 }
            p95Ms: { type: integer, minimum: 1 }
    LatencyStats:
      type: object
      description: Milliseconds; percentiles are nearest-rank (sampled beyond 20,000 runs).
      required: [min, avg, p50, p90, p95, p99, max]
      properties:
        min: { type: number }
        avg: { type: number }
        p50: { type: number }
        p90: { type: number }
        p95: { type: number }
        p99: { type: number }
        max: { type: number }
    LoadTestVerdict:
      type: object
      required: [passed, reasons]
      properties:
        passed: { type: boolean }
        reasons: { type: array, items: { type: string } }
    LoadTestIterations:
      type: object
      required: [completed, succeeded, failed]
      properties:
        completed: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
    LoadTest:
      type: object
      required:
        [id, workflowId, workflowName, workflowVersion, environment, config, status, startedAt, elapsedMs, activeVirtualUsers, iterations, throughput, errorRatePct, latency, nodes, timeline, errors]
      properties:
        id: { type: string }
        workflowId: { type: string }
        workflowName: { type: string }
        workflowVersion: { type: integer }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        config: { $ref: "#/components/schemas/LoadTestConfig" }
        status: { type: string, enum: [running, completed, stopped, interrupted] }
        verdict: { $ref: "#/components/schemas/LoadTestVerdict" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        elapsedMs: { type: integer }
        activeVirtualUsers: { type: integer }
        iterations: { $ref: "#/components/schemas/LoadTestIterations" }
        throughput: { type: number, description: Completed runs per second }
        errorRatePct: { type: number }
        latency:
          description: End-to-end run duration; null before the first run finishes.
          oneOf:
            - $ref: "#/components/schemas/LatencyStats"
            - type: "null"
        nodes:
          type: array
          items:
            type: object
            required: [nodeId, name, type, calls, failed, latency]
            properties:
              nodeId: { type: string }
              name: { type: string }
              type: { type: string }
              calls: { type: integer }
              failed: { type: integer }
              latency:
                oneOf:
                  - $ref: "#/components/schemas/LatencyStats"
                  - type: "null"
        timeline:
          type: array
          description: One point per second since the start.
          items:
            type: object
            required: [second, succeeded, failed, p95Ms, activeVirtualUsers]
            properties:
              second: { type: integer }
              succeeded: { type: integer }
              failed: { type: integer }
              p95Ms: { type: [number, "null"] }
              activeVirtualUsers: { type: integer }
        errors:
          type: array
          description: Most frequent failure messages (top 10)
          items:
            type: object
            required: [message, count]
            properties:
              message: { type: string }
              count: { type: integer }
    LoadTestSummary:
      type: object
      required: [id, workflowId, status, startedAt, elapsedMs, iterations, throughput, errorRatePct, environment, virtualUsers, p95Ms]
      properties:
        id: { type: string }
        workflowId: { type: string }
        status: { type: string, enum: [running, completed, stopped, interrupted] }
        verdict: { $ref: "#/components/schemas/LoadTestVerdict" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        elapsedMs: { type: integer }
        iterations: { $ref: "#/components/schemas/LoadTestIterations" }
        throughput: { type: number }
        errorRatePct: { type: number }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        virtualUsers: { type: integer }
        p95Ms: { type: [number, "null"] }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        issues:
          description: Validation issues (400 for malformed bodies, 422 for invalid graphs)
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    Position:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    NodeBase:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{0,63}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        position: { $ref: "#/components/schemas/Position" }
        disabled:
          type: boolean
          description: Bypassed when true - not executed, and the run continues through all of its outputs. Not allowed on the webhook trigger.
    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE]
    WebhookNode:
      description: Trigger. Exactly one per workflow. Output port `out`; output is the trigger payload.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: webhook }
            config:
              type: object
              required: [method, path]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                path: { type: string }
    HttpNode:
      description: |
        Sends an HTTP request. Output port `out`; output is `{ status, headers, body, durationMs }`.
        Responses with status >= 400 fail the step. Relative URLs resolve against the Reqora server origin.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: http }
            config:
              type: object
              required: [method, url]
              properties:
                method: { $ref: "#/components/schemas/HttpMethod" }
                url: { type: string, description: template }
                headers:
                  type: object
                  additionalProperties: { type: string, description: template }
                body: { type: string, description: JSON template }
                timeoutMs: { type: integer, minimum: 100, maximum: 30000, default: 10000 }
                requestId:
                  type: string
                  description: |
                    Saved Collections request this node is linked to (set when a request is dropped onto the canvas).
                    Every run (manual, replay or webhook) sends that request as it is now, exactly like Send in
                    Collections: collection and folder auth and headers, pre-request and post-response scripts, and tests.
                    A script error, a failed test or a status >= 400 fails the step; `rq.variables` carry over to later
                    linked nodes in the same run, and templates may also use `{{trigger.*}}` and earlier nodes. The
                    other config fields are its last copy (shown on the canvas). The step fails if the request was
                    deleted. Remove the field to unlink.
                repeat:
                  type: object
                  description: |
                    Repeat until (polling): after each send the condition is checked against this node's latest
                    response (`{{<node-id>.body.x}}`). When true, the run continues; otherwise the node sends again after
                    `intervalMs`, and the step fails once `maxAttempts` sends were made. A failed send (status >= 400,
                    script error, failed test) fails the step immediately. Kept when a linked node refreshes from its
                    saved request. `intervalMs × (maxAttempts − 1)` may be at most 10 minutes.
                  required: [left, operator]
                  properties:
                    mode:
                      type: string
                      enum: [compare, script]
                      default: compare
                      description: "`compare`: left operator right. `script`: `script` returns true when done."
                    script:
                      type: string
                      maxLength: 10000
                      description: |
                        JavaScript run in the script sandbox after each send. `response` has `status`, `headers` and the
                        parsed `body`; rq / pm (incl. `rq.environment.get`, `rq.variables`), lodash and moment work like in
                        request scripts. A plain expression or code with `return`; truthy = done. A thrown error fails
                        the step. Environment changes made here aren't saved.
                    left: { type: string, maxLength: 2000, description: "template (compare mode); an empty value fails the run" }
                    operator:
                      type: string
                      enum: ["==", "!=", ">", ">=", "<", "<=", contains, exists]
                    right: { type: string, maxLength: 2000, description: template (ignored for `exists`) }
                    intervalMs: { type: integer, minimum: 100, maximum: 60000, default: 2000 }
                    maxAttempts: { type: integer, minimum: 2, maximum: 100, default: 10 }
    ConditionNode:
      description: Compares two values. Output ports `true` and `false`; only the matching one continues.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: condition }
            config:
              type: object
              required: [left, operator]
              properties:
                left: { type: string, description: template }
                operator:
                  type: string
                  enum: ["==", "!=", ">", ">=", "<", "<=", contains, exists]
                right: { type: string, description: template (ignored for `exists`) }
    TransformNode:
      description: Builds a new object from templates. Output port `out`.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: transform }
            config:
              type: object
              required: [output]
              properties:
                output:
                  type: object
                  additionalProperties: { type: string, description: template }
    DelayNode:
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: delay }
            config:
              type: object
              required: [ms]
              properties:
                ms: { type: integer, minimum: 0, maximum: 10000 }
    ScriptNode:
      description: >-
        Runs JavaScript in the script sandbox between nodes. `trigger` (body, headers) and `nodes` (earlier node
        outputs by id) are defined; rq / pm (environment, variables), console, lodash, moment and the other script
        modules are available. rq.environment.set / unset are saved to the run's environment; rq.variables are
        shared with linked requests. The returned object is the node's output (any other JSON value becomes
        `{ value }`); throwing, or a failed rq.test, fails the step. Console output is recorded on the step's `logs`.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: script }
            config:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 20000 }
    ResponseNode:
      description: Terminal. Sets the run's `output` (and the webhook HTTP response). No output ports.
      allOf:
        - $ref: "#/components/schemas/NodeBase"
        - type: object
          required: [type, config]
          properties:
            type: { const: response }
            config:
              type: object
              required: [status]
              properties:
                status: { type: integer, minimum: 100, maximum: 599 }
                body: { type: string, description: JSON template }
    Node:
      oneOf:
        - $ref: "#/components/schemas/WebhookNode"
        - $ref: "#/components/schemas/HttpNode"
        - $ref: "#/components/schemas/ConditionNode"
        - $ref: "#/components/schemas/TransformNode"
        - $ref: "#/components/schemas/DelayNode"
        - $ref: "#/components/schemas/ScriptNode"
        - $ref: "#/components/schemas/ResponseNode"
      discriminator:
        propertyName: type
    Edge:
      type: object
      required: [id, source, sourcePort, target]
      properties:
        id: { type: string }
        source: { type: string, description: Source node id }
        sourcePort: { type: string, description: "`out`, or `true`/`false` for condition nodes" }
        target: { type: string, description: Target node id }
    WorkflowInput:
      type: object
      required: [name, nodes, edges]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        nodes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Node" }
        edges:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Edge" }
    Workflow:
      allOf:
        - $ref: "#/components/schemas/WorkflowInput"
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id: { type: string }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deployment: { $ref: "#/components/schemas/Deployment" }
    Deployment:
      description: The version live on the webhook endpoint. Absent until the first deploy.
      type: object
      required: [version, deployedAt]
      properties:
        version: { type: integer }
        deployedAt: { type: string, format: date-time }
    WorkflowSummary:
      type: object
      required: [id, name, version, nodeCount, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer }
        nodeCount: { type: integer }
        updatedAt: { type: string, format: date-time }
    EnvironmentName:
      type: string
      enum: [production, staging, sandbox]
      default: production
    Variable:
      type: object
      required: [name, kind, value, updatedAt]
      properties:
        name: { type: string }
        kind: { type: string, enum: [secret, plain] }
        value: { type: [string, "null"], description: null for secrets (write-only) }
        description: { type: string }
        updatedAt: { type: string, format: date-time }
    VariableReference:
      type: object
      required: [workflowId, workflowName, nodeId, nodeName]
      properties:
        workflowId: { type: string }
        workflowName: { type: string }
        nodeId: { type: string }
        nodeName: { type: string }
    RunInput:
      type: object
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        trigger:
          type: object
          properties:
            body: {}
            headers:
              type: object
              additionalProperties: { type: string }
    RunStatus:
      type: string
      enum: [succeeded, failed]
    Step:
      type: object
      required: [nodeId, nodeType, name, status, startedAt, durationMs]
      properties:
        nodeId: { type: string }
        nodeType: { type: string }
        name: { type: string }
        status: { type: string, enum: [succeeded, failed, skipped] }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        port: { type: string, description: Output port taken (condition nodes report `true`/`false`) }
        request:
          description: HTTP nodes only. The request as sent, with resolved values.
          type: object
          properties:
            method: { type: string }
            url: { type: string }
            headers: { type: object, additionalProperties: { type: string } }
        output: {}
        error: { type: string }
        disabled: { type: boolean, description: "Skipped because the node is disabled (the run continued through it)" }
        attempts: { type: integer, description: "How many times a repeat-until http node sent its request" }
        checks:
          type: array
          description: "A repeat-until node's condition checks (most recent 20): result, the script's console output (or the compared value), error"
          items:
            type: object
            required: [attempt, met]
            properties:
              attempt: { type: integer }
              met: { type: boolean }
              logs: { type: array, items: { type: string } }
              error: { type: string }
        logs:
          type: array
          items: { type: string }
          description: "A script node's console output (most recent 20 lines)"
    Run:
      type: object
      required: [id, workflowId, workflowVersion, environment, status, trigger, startedAt, finishedAt, durationMs, steps]
      properties:
        id: { type: string }
        workflowId: { type: string }
        workflowVersion: { type: integer }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        status: { $ref: "#/components/schemas/RunStatus" }
        trigger:
          type: object
          properties:
            source: { type: string, enum: [manual, webhook] }
            body: {}
            headers: { type: object, additionalProperties: { type: string } }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        output:
          description: Set when a Response node executed
          type: object
          properties:
            status: { type: integer }
            body: {}
        error: { type: string }
        replayOf: { type: string, description: Id of the run this one replayed }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    CollectionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    Collection:
      type: object
      required: [id, name, createdAt, updatedAt, settings, folders, requests]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/ScopeSettings" }
        folders:
          type: array
          items: { $ref: "#/components/schemas/Folder" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/RequestSummary" }
    Folder:
      type: object
      required: [id, collectionId, name, position, settings]
      properties:
        id: { type: string }
        collectionId: { type: string }
        name: { type: string }
        position: { type: integer }
        settings: { $ref: "#/components/schemas/ScopeSettings" }
    Auth:
      description: |
        `inherit` (the default for requests and folders) uses the nearest parent's auth: request → folder →
        collection; an inheriting collection means no auth. Adds an Authorization (or API key) header unless a
        header of that name is set explicitly or by a pre-request script.
      oneOf:
        - type: object
          required: [type]
          properties: { type: { enum: [inherit, none] } }
        - type: object
          required: [type, token]
          properties: { type: { const: bearer }, token: { type: string } }
        - type: object
          required: [type, username, password]
          properties: { type: { const: basic }, username: { type: string }, password: { type: string } }
        - type: object
          required: [type, header, value]
          properties: { type: { const: apiKey }, header: { type: string }, value: { type: string } }
    ScopeSettings:
      type: object
      description: |
        Shared by every request in a collection or folder. Headers merge collection → folder → request (the more
        specific level wins on the same name); scripts run collection → folder → request in both phases.
      properties:
        auth: { $ref: "#/components/schemas/Auth" }
        headers:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/KeyValue" }
        preScript: { type: string, maxLength: 50000, description: "Pre-request script (see Scripts in the API description)" }
        postScript: { type: string, maxLength: 50000, description: Post-response script }
    ScriptReport:
      type: object
      required: [logs, tests, errors, variables]
      properties:
        logs:
          type: array
          items:
            type: object
            required: [level, message, scope, source]
            properties:
              level: { type: string, enum: [log, info, warn, error] }
              message: { type: string }
              scope: { type: string, enum: [collection, folder, request] }
              source: { type: string, description: "Name of the collection, folder or request" }
        tests:
          type: array
          items:
            type: object
            required: [name, passed, scope, source]
            properties:
              name: { type: string }
              passed: { type: boolean }
              error: { type: string }
              scope: { type: string, enum: [collection, folder, request] }
              source: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [phase, scope, source, message]
            properties:
              phase: { type: string, enum: [pre, post] }
              scope: { type: string, enum: [collection, folder, request] }
              source: { type: string }
              message: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }
          description: "Values set with rq.variables.set, available to templates as {{vars.NAME}}"
        environment:
          type: object
          additionalProperties: { type: [string, "null"] }
          description: "Changes from rq.environment.set / unset (null = unset), saved to the environment the request was sent in"
    SendRecord:
      type: object
      required: [id, requestId, collectionId, name, method, url, environment, status, statusText, error, durationMs, size, tests, scripts, request, response, sentAt]
      properties:
        id: { type: string }
        requestId: { type: [string, "null"] }
        collectionId: { type: [string, "null"] }
        name: { type: string }
        method: { type: string }
        url: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        status: { type: [integer, "null"], description: "null when no HTTP response was received" }
        statusText: { type: [string, "null"] }
        error: { type: [string, "null"] }
        durationMs: { type: integer }
        size: { type: [integer, "null"] }
        tests:
          type: object
          required: [passed, total]
          description: Assertions plus script tests
          properties:
            passed: { type: integer }
            total: { type: integer }
        scripts:
          oneOf:
            - { $ref: "#/components/schemas/ScriptReport" }
            - { type: "null" }
        request:
          oneOf:
            - { $ref: "#/components/schemas/SentRequest" }
            - { type: "null" }
        response:
          oneOf:
            - type: object
              required: [headers, body, truncated]
              properties:
                headers: { type: object, additionalProperties: { type: string } }
                body: { type: string, description: "Response body text (first 256 KB)" }
                truncated: { type: boolean }
            - { type: "null" }
        sentAt: { type: string, format: date-time }
    SentRequest:
      type: object
      description: The request as it went on the wire (after scripts, templates and auth), with real values in send responses and send history
      required: [method, url, headers]
      properties:
        method: { type: string }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string, description: "The body text; for multipart, a readable version with file contents left out" }
        form:
          type: array
          description: Multipart form-data parts
          items:
            type: object
            required: [key]
            properties:
              key: { type: string }
              value: { type: string }
              fileName: { type: string }
              contentType: { type: string }
              size: { type: integer }
        file:
          type: object
          description: A binary body's file
          required: [fileName, contentType, size]
          properties:
            fileName: { type: string }
            contentType: { type: string }
            size: { type: integer }
    FormField:
      description: A multipart form-data field. File contents are stored with the request (base64, up to 1 MB).
      oneOf:
        - type: object
          required: [kind, key]
          properties:
            kind: { const: text }
            key: { type: string, maxLength: 500 }
            value: { type: string, maxLength: 4000 }
            enabled: { type: boolean, default: true }
        - type: object
          required: [kind, key]
          properties:
            kind: { const: file }
            key: { type: string, maxLength: 500 }
            enabled: { type: boolean, default: true }
            fileName: { type: string, maxLength: 255, default: "", description: Empty until a file is chosen }
            contentType: { type: string, maxLength: 200, default: "" }
            data: { type: string, contentEncoding: base64, default: "", description: Base64 file contents }
    RequestSummary:
      type: object
      required: [id, name, method, url, folderId]
      properties:
        id: { type: string }
        name: { type: string }
        method: { $ref: "#/components/schemas/RequestMethod" }
        url: { type: string }
        folderId: { type: [string, "null"] }
    RequestMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
    KeyValue:
      type: object
      required: [key, value]
      properties:
        key: { type: string, maxLength: 500 }
        value: { type: string, maxLength: 4000, description: template }
        enabled: { type: boolean, default: true }
    RequestDefinition:
      type: object
      description: Every string field except `key`s is a *template*. Omitted fields take their defaults.
      properties:
        method: { $ref: "#/components/schemas/RequestMethod" }
        url: { type: string, maxLength: 2000, default: "", description: "Absolute, or relative to the Reqora server origin" }
        params:
          description: Enabled params are appended to the URL as a query string at send time
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/KeyValue" }
        headers:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/KeyValue" }
        auth: { $ref: "#/components/schemas/Auth" }
        preScript: { type: string, maxLength: 50000, default: "", description: "Runs after the collection's and folder's pre-request scripts" }
        postScript: { type: string, maxLength: 50000, default: "", description: "Runs after the collection's and folder's post-response scripts" }
        body:
          description: |
            Ignored for GET and HEAD. `json` text is a JSON template (see the API description); `text` is sent as-is.
            `urlencoded` is sent as application/x-www-form-urlencoded; `formdata` as multipart/form-data with a
            generated boundary (any Content-Type header is replaced); `binary` sends one file as the raw body. Field keys and text values may use templates.
          oneOf:
            - type: object
              required: [type]
              properties: { type: { const: none } }
            - type: object
              required: [type, text]
              properties: { type: { enum: [json, text] }, text: { type: string, maxLength: 100000 } }
            - type: object
              required: [type, fields]
              properties:
                type: { const: urlencoded }
                fields: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/KeyValue" } }
            - type: object
              required: [type, fields]
              properties:
                type: { const: formdata }
                fields: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/FormField" } }
            - type: object
              required: [type]
              description: One file sent as the raw body, with its content type unless a Content-Type header is set
              properties:
                type: { const: binary }
                fileName: { type: string, maxLength: 255, default: "" }
                contentType: { type: string, maxLength: 200, default: "" }
                data: { type: string, contentEncoding: base64, default: "", description: "Base64 file contents (up to 1 MB)" }
        assertions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Assertion" }
        settings:
          type: object
          properties:
            timeoutMs: { type: integer, minimum: 100, maximum: 30000, default: 10000 }
            followRedirects: { type: boolean, default: true }
    Assertion:
      description: |
        Declarative response checks (no scripting). JSON paths are dot paths such as `customer.id` or
        `items.0.sku` (a leading `$.` and `[0]` indexes are accepted). `jsonPathEquals` compares loosely:
        `"42"` equals 42, `"true"` equals true, objects and arrays compare by their JSON.
      oneOf:
        - type: object
          required: [type, equals]
          properties: { type: { const: status }, equals: { type: integer, minimum: 100, maximum: 599 } }
        - type: object
          required: [type, ms]
          properties: { type: { const: responseTimeBelow }, ms: { type: integer, minimum: 1 } }
        - type: object
          required: [type, header, value]
          properties: { type: { const: headerContains }, header: { type: string }, value: { type: string } }
        - type: object
          required: [type, text]
          properties: { type: { const: bodyContains }, text: { type: string } }
        - type: object
          required: [type, path, value]
          properties: { type: { const: jsonPathEquals }, path: { type: string }, value: { type: string } }
        - type: object
          required: [type, path]
          properties: { type: { const: jsonPathExists }, path: { type: string } }
    AssertionResult:
      type: object
      required: [assertion, passed]
      properties:
        assertion: { $ref: "#/components/schemas/Assertion" }
        passed: { type: boolean }
        actual: { type: string, description: "The observed value, when meaningful" }
    SavedRequest:
      type: object
      required: [id, collectionId, folderId, name, position, definition, createdAt, updatedAt]
      properties:
        id: { type: string }
        collectionId: { type: string }
        folderId: { type: [string, "null"] }
        name: { type: string }
        position: { type: integer }
        definition: { $ref: "#/components/schemas/RequestDefinition" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SendResult:
      type: object
      required: [request, status, statusText, headers, body, size, durationMs, url, assertions, scripts]
      properties:
        request: { $ref: "#/components/schemas/SentRequest" }
        status: { type: integer }
        statusText: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: { description: "Parsed JSON when the response content type is JSON, otherwise the text" }
        size: { type: integer, description: Body size in bytes }
        durationMs: { type: integer }
        url: { type: string, description: Resolved URL }
        assertions:
          type: array
          items: { $ref: "#/components/schemas/AssertionResult" }
        scripts: { $ref: "#/components/schemas/ScriptReport" }
    SendFailure:
      type: object
      description: No HTTP response was received (including when a pre-request script fails)
      required: [error, durationMs]
      properties:
        request: { $ref: "#/components/schemas/SentRequest" }
        error: { type: string }
        url: { type: string }
        durationMs: { type: integer }
        scripts: { $ref: "#/components/schemas/ScriptReport" }
    SendOutcome:
      oneOf:
        - $ref: "#/components/schemas/SendResult"
        - $ref: "#/components/schemas/SendFailure"
    ExampleResponse:
      type: object
      required: [status]
      properties:
        status: { type: integer, minimum: 100, maximum: 599 }
        statusText: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        body: {}
        size: { type: integer }
        durationMs: { type: number }
    ExportedRequest:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        definition: { $ref: "#/components/schemas/RequestDefinition" }
        examples:
          type: array
          items:
            type: object
            required: [name, response]
            properties:
              name: { type: string }
              response: { $ref: "#/components/schemas/ExampleResponse" }
    CollectionExport:
      type: object
      description: A collection exported from Reqora (see exportCollection).
      required: [reqora, version, collection]
      properties:
        reqora: { const: collection }
        version: { const: 1 }
        exportedAt: { type: string, format: date-time }
        collection:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            settings: { $ref: "#/components/schemas/ScopeSettings" }
            folders:
              type: array
              items:
                type: object
                required: [name, requests]
                properties:
                  name: { type: string }
                  settings: { $ref: "#/components/schemas/ScopeSettings" }
                  requests: { type: array, items: { $ref: "#/components/schemas/ExportedRequest" } }
            requests:
              type: array
              description: Requests at the collection root.
              items: { $ref: "#/components/schemas/ExportedRequest" }
    Example:
      type: object
      required: [id, requestId, name, status, response, createdAt]
      properties:
        id: { type: string }
        requestId: { type: string }
        name: { type: string }
        status: { type: integer }
        response: { $ref: "#/components/schemas/ExampleResponse" }
        createdAt: { type: string, format: date-time }
